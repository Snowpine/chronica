<style>
/* Layout: an atlas sheet — the map fills the sheet, a ledger column on the right, a time ruler across the bottom */
:root {
  --paper: #f4f6f7; --panel: #ffffff; --sea: #d5e0e7; --outside: #e6eaec; --grat: #c3d0d8;
  --land: #f1eee6; --land-empty: #ece8df; --land-people: #e5e2d4; --n0: #e6dcc5; --n1: #d5cbb2; --n2: #dcdcca; --n3: #e3d3c5; --n4: #cfd4cd;
  --ink: #1c2830; --muted: #56656f; --faint: #8796a0; --rule: #d6dee3; --border-poly: rgba(28, 40, 48, .42);
  --label: #1f2c35; --halo: rgba(255, 255, 255, .78);
  --accent: #d6402a; --accent-soft: rgba(214, 64, 42, .13);
  --chg: #1f2b33; --chg-soft: rgba(31, 43, 51, .08);
  --era-a: #e8edf0; --era-b: #dde4e9;
  --river: #5f93b8; --river-label: #4a7899; --mtn: rgba(82, 64, 42, .42); --mtn-label: #76664f;
  --f-display: "ZCOOL XiaoWei", "Songti SC", "STSong", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "IBM Plex Sans Condensed", "Arial Narrow", "Noto Sans SC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10171c; --panel: #162027; --sea: #0b1318; --outside: #141c21; --grat: #1b2830;
    --land: #2a3035; --land-empty: #23292d; --land-people: #2b302f; --n0: #3b372e; --n1: #2e2b25; --n2: #353930; --n3: #3d3433; --n4: #30363a;
    --ink: #e2e9ed; --muted: #9aa9b2; --faint: #6e7e88; --rule: #26323a; --border-poly: rgba(4, 8, 10, .75);
    --label: #edf2f4; --halo: rgba(8, 12, 15, .72);
    --accent: #ff6a4d; --accent-soft: rgba(255, 106, 77, .16);
    --chg: #f3ede2; --chg-soft: rgba(243, 237, 226, .1);
    --era-a: #19232a; --era-b: #1f2a32;
    --river: #5383a3; --river-label: #82abc4; --mtn: rgba(228, 214, 190, .26); --mtn-label: #a99b86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10171c; --panel: #162027; --sea: #0b1318; --outside: #141c21; --grat: #1b2830;
  --land: #2a3035; --land-empty: #23292d; --land-people: #2b302f; --n0: #3b372e; --n1: #2e2b25; --n2: #353930; --n3: #3d3433; --n4: #30363a;
  --ink: #e2e9ed; --muted: #9aa9b2; --faint: #6e7e88; --rule: #26323a; --border-poly: rgba(4, 8, 10, .75);
  --label: #edf2f4; --halo: rgba(8, 12, 15, .72);
  --accent: #ff6a4d; --accent-soft: rgba(255, 106, 77, .16);
  --chg: #f3ede2; --chg-soft: rgba(243, 237, 226, .1);
  --era-a: #19232a; --era-b: #1f2a32;
  --river: #5383a3; --river-label: #82abc4; --mtn: rgba(228, 214, 190, .26); --mtn-label: #a99b86;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* the page's built-in text is a placeholder: it stays hidden until the reader's language is filled in */
html:not(.i18n) [data-i18n]:not(#loading), html:not(.i18n) #lang { visibility: hidden; }
html:not(.i18n) #q::placeholder { color: transparent; }

.app {
  height: 100%; display: grid; gap: 10px 14px;
  grid-template-columns: minmax(0, 1fr) 340px;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "head head" "map side" "time time";
  padding-block: 10px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

header { grid-area: head; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.brand h1 { margin: 0; font: 400 30px/1 var(--f-display); letter-spacing: .08em; }
.brand p { margin: 4px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.clock { display: flex; align-items: center; gap: 8px; }
.yearbox { width: 12.5rem; text-align: center; line-height: 1; }
.year { font: 600 34px/1 var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.year small { font: 400 14px var(--f-body); color: var(--muted); margin-left: 3px; }
.era { margin-top: 4px; font-size: 12px; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
.era b { font: 600 12px var(--f-num); color: var(--ink); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.era b.lag { color: var(--accent); }
.btn {
  height: 34px; min-width: 34px; padding: 0 9px; display: inline-grid; place-items: center;
  border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; cursor: pointer;
}
.btn:hover { border-color: var(--faint); }
.btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn.play { background: var(--ink); color: var(--paper); border-color: var(--ink); min-width: 42px; }
.btn.play svg { fill: currentColor; stroke: none; }
.chip {
  height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--rule); background: var(--panel);
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted);
}
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.chip i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.chip .sw-chg { background: repeating-linear-gradient(45deg, var(--chg) 0 1.5px, transparent 1.5px 4.5px); outline: 1px solid var(--chg); }
.chip .sw-ev { background: var(--ink); transform: rotate(45deg) scale(.75); border-radius: 1px; }
.chip .sw-modern { border-top: 2px dashed var(--ink); height: 0; border-radius: 0; }
.chip .sw-phys { height: 7px; border-radius: 0; border-bottom: 2px solid var(--river-label); }

.mapwrap { grid-area: map; position: relative; min-height: 0; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; background: var(--outside); }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map:active { cursor: grabbing; }
.maphint {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 14px; border-radius: 8px;
  background: color-mix(in srgb, var(--ink) 82%, transparent); color: var(--paper); font-size: 13px; pointer-events: none; white-space: nowrap;
}
.maphint[hidden] { display: none; }
.sea { fill: var(--sea); }
.grat { fill: none; stroke: var(--grat); stroke-width: .6px; vector-effect: non-scaling-stroke; }
.poly { stroke: var(--border-poly); stroke-width: .6px; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: opacity .25s; }
.poly.vassal { stroke-dasharray: 3 2; }
.poly.dim { opacity: .28; }
.poly.soft { opacity: .45; }
.poly.sel { stroke: var(--ink); stroke-width: 1.8px; }
.chg { fill: url(#hatch); stroke: var(--chg); stroke-width: 1px; stroke-opacity: .55; vector-effect: non-scaling-stroke; stroke-linejoin: round; cursor: pointer; }
.chg.hot { stroke-width: 2.5px; stroke-opacity: 1; }
.hatch-bg { fill: var(--chg-soft); }
.hatch-line { stroke: var(--chg); stroke-width: 1; stroke-opacity: .4; }
.pulse { fill: var(--chg); stroke: none; pointer-events: none; opacity: 0; animation: pulse 2s ease-out; }
@keyframes pulse { 0% { opacity: .5; } 100% { opacity: 0; } }
.modern { fill: none; stroke: var(--ink); stroke-width: 1px; stroke-dasharray: 5 3; opacity: .6; vector-effect: non-scaling-stroke; pointer-events: none; }
.label { fill: var(--label); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; pointer-events: none; font-weight: 500; }
.label.big { font-weight: 700; letter-spacing: .14em; }
.label.people { font-weight: 400; font-style: italic; fill: var(--muted); }
.label.hit { font-weight: 700; }
.label.dim { opacity: .3; }
.label.soft { opacity: .55; }
.river { fill: none; stroke: var(--river); stroke-opacity: .8; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.river.r1 { stroke-width: 1.9px; }
.river.r2 { stroke-width: 1.6px; }
.river.r3 { stroke-width: 1.3px; }
.river.r4 { stroke-width: 1.1px; }
.river.r5 { stroke-width: 1px; }
#map:not(.z2) .river.r4, #map:not(.z3) .river.r5 { display: none; }
.lake { fill: var(--sea); stroke: var(--river); stroke-width: .5px; vector-effect: non-scaling-stroke; pointer-events: none; }
.range { fill: url(#mtn); stroke: none; pointer-events: none; }
.phys { transition: opacity .25s; }
.phys.muted { opacity: .45; }
.mtn-mark { fill: none; stroke: var(--mtn); stroke-width: 1; stroke-linejoin: round; stroke-linecap: round; }
.phys-l { font-size: 11px; paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.phys-l.rv { fill: var(--river-label); letter-spacing: .18em; }
.phys-l.mt { fill: var(--mtn-label); letter-spacing: .32em; }
.credit a { color: inherit; }
.city circle { fill: var(--panel); stroke: var(--ink); stroke-width: 1.2px; }
.city text { font-size: 12px; fill: var(--muted); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.city .now { font-size: 11px; fill: var(--faint); }
.ev { cursor: pointer; }
.ev path { fill: var(--ink); stroke: var(--panel); stroke-width: 1.5px; }
.ev.now path { fill: var(--accent); }
.ev.sel path { fill: var(--accent); stroke: var(--ink); stroke-width: 2px; }
.ev text { font-size: 12px; fill: var(--ink); font-weight: 500; paint-order: stroke; stroke: var(--halo); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.ev.pop path { animation: pop .55s ease-out; }
@keyframes pop { from { transform: scale(2.6); opacity: 0; } }

.zoomctl { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoomctl .btn { font-size: 18px; line-height: 1; }
.zoomctl .btn[aria-expanded="true"] { border-color: var(--ink); }
/* layer switches: a small menu next to the zoom buttons, so the header fits on one line */
.layers {
  position: absolute; right: 54px; bottom: 130px; z-index: 6; display: flex; flex-direction: column; gap: 4px; min-width: 150px;
  padding: 6px; border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); box-shadow: 0 8px 24px rgba(0, 0, 0, .14);
}
.layers[hidden] { display: none; }
.layers .chip { width: 100%; border-color: transparent; border-radius: 7px; padding: 0 10px; }
.layers .chip:hover { background: color-mix(in srgb, var(--rule) 45%, transparent); }
.layers .chip[aria-pressed="true"] { border-color: transparent; }
.layers .chip::after { content: ""; width: 9px; height: 5px; margin: 0 1px 3px auto; border: solid var(--ink); border-width: 0 0 2px 2px; transform: rotate(-45deg); opacity: 0; }
.layers .chip[aria-pressed="true"]::after { opacity: 1; }
.tip {
  position: absolute; left: 0; top: 0; pointer-events: none; max-width: 260px; z-index: 5;
  padding: 7px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--rule);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .14); font-size: 12px; line-height: 1.45;
}
.tip b { display: block; font-size: 13px; }
.tip span { display: block; color: var(--muted); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); background: var(--outside); }

aside { grid-area: side; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 18px; padding: 2px 4px 12px 0; }
aside h2 { margin: 0 0 4px; font-size: 13px; font-weight: 500; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
aside h2 span { font: 400 12px var(--f-num); color: var(--faint); font-variant-numeric: tabular-nums; }
aside h3 { margin: 10px 0 2px; font-size: 12px; font-weight: 500; color: var(--muted); }
.note { margin: 4px 0 6px; font-size: 12px; color: var(--muted); background: var(--accent-soft); border-radius: 6px; padding: 6px 8px; }
.empty { margin: 6px 0; font-size: 13px; color: var(--muted); }
.row {
  width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; text-align: left;
  background: none; border: 0; border-top: 1px solid var(--rule); padding: 8px 2px; cursor: pointer;
}
.row:hover { background: color-mix(in srgb, var(--rule) 45%, transparent); }
.row b { font-weight: 500; }
.row small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row.later { opacity: .62; }
.sw { width: 14px; height: 14px; border-radius: 3px; margin-top: 3px; border: 1px solid var(--border-poly); }
.yr { font: 500 13px var(--f-num); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 2.6em; padding-top: 1px; }
.more { font-size: 12px; color: var(--faint); margin: 6px 0 0; }

.card { border: 1px solid var(--rule); background: var(--panel); border-radius: 12px; padding: 12px 14px 14px; }
.card-top { display: flex; justify-content: space-between; align-items: center; }
.tag { font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.x { border: 0; background: none; cursor: pointer; font-size: 18px; color: var(--muted); line-height: 1; padding: 2px 4px; border-radius: 6px; }
.x:hover { color: var(--ink); }
.card .cy { font: 600 22px/1.1 var(--f-num); margin-top: 6px; font-variant-numeric: tabular-nums; }
.card h4 { margin: 4px 0 2px; font: 400 22px/1.3 var(--f-display); letter-spacing: .04em; }
.card p { margin: 4px 0; font-size: 13px; }
.card .en { color: var(--faint); font-size: 12px; margin-top: 0; }
.card .meta { color: var(--muted); }
.runs { list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; }
.runs li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-top: 1px dotted var(--rule); }
.runs .yr { min-width: 0; font-size: 12px; }
.spark { width: 100%; height: auto; display: block; margin: 8px 0 2px; }
.spark-now { stroke: var(--accent); stroke-width: 1.2; }
.spark-now.a { stroke: var(--faint); stroke-dasharray: 3 2; }
#side:focus { outline: none; }
.spark-t { font: 11px var(--f-body); fill: var(--muted); }
.link { margin-top: 8px; border: 1px solid var(--rule); background: none; border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.link:hover { border-color: var(--faint); }
.link i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend svg { width: 12px; height: 12px; overflow: visible; }
.legend path { fill: var(--ink); }
.credit, .keys { margin: 8px 0 0; font-size: 11.5px; color: var(--faint); line-height: 1.6; }
.keys kbd { font: 500 11px var(--f-num); border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; color: var(--muted); }

.timewrap { grid-area: time; position: relative; }
/* shows or hides the per-power lanes; it sits in the label column, level with the era bar */
.lanes-tog {
  position: absolute; top: 2px; height: 20px; padding: 0 8px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  border: 1px solid var(--rule); border-radius: 10px; background: var(--panel); cursor: pointer; font-size: 11.5px; color: var(--muted);
}
.lanes-tog:hover, .lanes-tog[aria-expanded="true"] { color: var(--ink); border-color: var(--faint); }
.lanes-tog::after { content: ""; width: 5px; height: 5px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg); }
.lanes-tog[aria-expanded="true"]::after { transform: translateY(1px) rotate(-135deg); }
#tl { display: block; width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
#tl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.era-r { stroke: var(--paper); stroke-width: 2; }
.era-t { font-size: 11px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; letter-spacing: .08em; pointer-events: none; }
.lane-l { font-size: 11px; fill: var(--muted); text-anchor: end; dominant-baseline: central; cursor: pointer; }
.lane-l:hover, .lane-l.on { fill: var(--ink); font-weight: 700; }
.lane-b { transition: opacity .2s; pointer-events: none; }
.lane-b.dim { opacity: .22; }
.lane-sel { fill: color-mix(in srgb, var(--ink) 7%, transparent); pointer-events: none; }
.row-l { font-size: 11px; fill: var(--faint); text-anchor: end; dominant-baseline: central; }
.den { fill: var(--faint); opacity: .55; }
.ctick { stroke: var(--chg); stroke-width: 1.5; }
.ctick-d { fill: var(--chg); }
.snap-span { fill: color-mix(in srgb, var(--ink) 7%, transparent); pointer-events: none; }
.axis-t { font: 11px var(--f-num); fill: var(--faint); font-variant-numeric: tabular-nums; }
.axis-l { stroke: var(--rule); }
.ph-line { stroke: var(--accent); stroke-width: 1.6; pointer-events: none; }
.ph-knob { fill: var(--accent); stroke: var(--paper); stroke-width: 2; pointer-events: none; }
.ghost { stroke: var(--muted); stroke-dasharray: 2 3; pointer-events: none; }
.ghost-t { font: 500 11px var(--f-num); fill: var(--muted); pointer-events: none; }

/* reading layout: a story's full text in a wide column, the map beside it following the step being read */
.app.reading { grid-template-columns: minmax(0, 1fr) min(600px, 46vw); grid-template-rows: minmax(0, 1fr); grid-template-areas: "map side"; }
.app.reading header, .app.reading .timewrap { display: none; }
.app.reading aside { padding: 0; }
.read-year { display: none; position: absolute; left: 12px; top: 12px; padding: 3px 11px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); font: 600 20px/1.4 var(--f-num); font-variant-numeric: tabular-nums; pointer-events: none; }
.read-year small { font: 400 13px var(--f-body); color: var(--muted); margin-left: 2px; }
.app.reading .read-year { display: block; }
.reader { border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); }
.rd-bar {
  position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 7px 10px 7px 22px; border-bottom: 1px solid var(--rule); border-radius: 12px 12px 0 0;
  background: color-mix(in srgb, var(--panel) 94%, transparent); font-size: 12.5px; color: var(--muted);
}
.rd-bar b { font: 600 13px var(--f-num); color: var(--ink); }
.rd-head { padding: 26px 30px 10px; }
.rd-span { font: 500 13px var(--f-num); color: var(--accent); font-variant-numeric: tabular-nums; }
.rd-head h2 { margin: 4px 0 8px; font: 400 32px/1.25 var(--f-display); letter-spacing: .04em; }
.rd-head > p { margin: 0; font-size: 15px; color: var(--muted); }
.rd-toc { list-style: none; margin: 18px 0 0; padding: 0; }
.rd-toc button { width: 100%; display: flex; gap: 10px; padding: 6px 0; border: 0; border-top: 1px dotted var(--rule); background: none; cursor: pointer; text-align: left; font-size: 14px; color: var(--muted); }
.rd-toc button:hover, .rd-toc li.on button { color: var(--ink); }
.rd-toc li.on .yr { color: var(--accent); }
.rd-step { padding: 30px 30px 12px; border-top: 1px solid var(--rule); scroll-margin-top: 38px; }
.rd-k { font: 500 13px var(--f-num); color: var(--faint); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.rd-step.on .rd-k { color: var(--accent); }
.rd-step h3 { margin: 4px 0 14px; font: 400 26px/1.3 var(--f-display); letter-spacing: .04em; }
.rd-step p { margin: 0 0 1.05em; font-size: 16.5px; line-height: 1.9; }
.rd-step .rd-lead { font-weight: 500; }
.facts { margin: 6px 0 20px; padding: 10px 14px 11px; border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; background: var(--accent-soft); }
.facts dt { margin-bottom: 4px; font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.facts dd { margin: 3px 0 0; display: flex; justify-content: space-between; gap: 14px; font-size: 13.5px; }
.facts dd span { color: var(--muted); }
.facts dd b { font-weight: 500; text-align: right; }
.rd-end { display: flex; flex-wrap: wrap; gap: 8px; padding: 22px 30px 55vh; border-top: 1px solid var(--rule); }
.rd-end .btn { padding: 0 14px; font-size: 13px; }
:root:not([lang|="zh"]) .rd-step p { font-family: "Spectral", Georgia, serif; font-size: 17.5px; line-height: 1.7; }
:root:not([lang|="zh"]) .rd-step .rd-lead { font-weight: 600; }

.modes { display: inline-flex; padding: 2px; border: 1px solid var(--rule); border-radius: 9px; background: var(--panel); }
.modes button { height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 13px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.stories { display: flex; flex-direction: column; gap: 8px; }
.chapter {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; text-align: left; cursor: pointer;
  padding: 10px 12px 11px; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel);
}
.chapter:hover { border-color: var(--faint); }
.chapter .ch-yr { grid-column: 1 / -1; font: 500 12px var(--f-num); color: var(--accent); font-variant-numeric: tabular-nums; }
.chapter b { font: 400 20px/1.3 var(--f-display); letter-spacing: .04em; }
.chapter .ch-n { align-self: center; font-size: 12px; color: var(--faint); }
.chapter small { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.story { padding: 12px 14px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--panel); }
.story-top { display: flex; justify-content: space-between; align-items: center; }
.back { padding: 2px 0; border: 0; background: none; cursor: pointer; font-size: 12px; color: var(--muted); }
.back:hover { color: var(--ink); }
.story-ch { margin-top: 8px; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.story .cy { margin-top: 4px; font: 600 26px/1.1 var(--f-num); color: var(--accent); font-variant-numeric: tabular-nums; }
.story h4 { margin: 2px 0 8px; font: 400 24px/1.3 var(--f-display); letter-spacing: .04em; text-wrap: balance; }
.story p { margin: 0; font-size: 14px; line-height: 1.8; }
.story .link { margin-top: 10px; }
.story-dots { display: flex; gap: 6px; margin: 12px 0 8px; }
.sd { position: relative; width: 24px; height: 18px; padding: 0; border: 0; background: none; cursor: pointer; }
.sd::after { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 6px; border-radius: 3px; background: var(--rule); }
.sd.on::after { background: var(--accent); }
.story-nav { display: flex; justify-content: space-between; gap: 8px; }
.story-nav .btn { padding: 0 14px; font-size: 13px; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.story-band { fill: var(--accent-soft); pointer-events: none; }
.sdot { fill: var(--panel); stroke: var(--accent); stroke-width: 2; cursor: pointer; }
.sdot.on { fill: var(--accent); }
.cmp-div line { stroke: var(--ink); stroke-width: 2; pointer-events: none; }
.cmp-div .hit { fill: transparent; cursor: ew-resize; }
.cmp-knob { cursor: ew-resize; }
.cmp-knob circle { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
.cmp-knob path { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.cmp-badge { pointer-events: none; }
.cmp-badge text { font: 600 13px var(--f-num); dominant-baseline: central; font-variant-numeric: tabular-nums; }
.cmp-badge.a rect { fill: var(--panel); stroke: var(--muted); }
.cmp-badge.a text { fill: var(--ink); }
.cmp-badge.b rect { fill: var(--accent); }
.cmp-badge.b text { fill: #fff; }
.ph-a-line { stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 3 2; pointer-events: none; }
.ph-a-knob { fill: var(--panel); stroke: var(--muted); stroke-width: 2; pointer-events: none; }
.cmp-steps { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 8px; }
.cmp-step { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.cmp-step b { font: 600 14px var(--f-num); color: var(--ink); min-width: 2.6em; text-align: center; font-variant-numeric: tabular-nums; }
.cmp-step .btn { height: 28px; min-width: 28px; padding: 0 6px; }
.cmp-knob:focus { outline: none; }
.cmp-knob:focus-visible circle { stroke: var(--accent); stroke-width: 3px; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; margin: 4px 0 2px; }
.preset { text-align: left; padding: 6px 9px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); cursor: pointer; }
.preset:hover { border-color: var(--faint); }
.preset.on { border-color: var(--ink); }
.preset b { display: block; font: 600 13px var(--f-num); font-variant-numeric: tabular-nums; }
.preset small { display: block; font-size: 12px; color: var(--muted); }
.delta { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.search { position: relative; flex: 1 1 160px; max-width: 300px; min-width: 0; }
.search > svg { position: absolute; left: 10px; top: 9px; width: 16px; height: 16px; fill: none; stroke: var(--faint); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.search input {
  width: 100%; height: 34px; padding: 0 30px 0 32px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--panel); color: var(--ink); font: 13px var(--f-body);
}
.search input::placeholder { color: var(--faint); }
.search input:focus { outline: none; border-color: var(--ink); }
.q-key { position: absolute; right: 8px; top: 8px; font: 500 11px var(--f-num); color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; pointer-events: none; }
.search input:focus ~ .q-key, .search input:not(:placeholder-shown) ~ .q-key { display: none; }
#qlist {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: max(100%, 330px); max-width: calc(100vw - 32px);
  margin: 0; padding: 4px; list-style: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 14px 36px rgba(0, 0, 0, .18);
}
#qlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
#qlist li[aria-selected="true"] { background: color-mix(in srgb, var(--rule) 70%, transparent); }
#qlist .q-name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#qlist mark { background: none; color: var(--accent); font-weight: 700; }
#qlist .q-type { align-self: center; font-size: 11px; color: var(--muted); letter-spacing: .1em; }
#qlist .q-sub { grid-column: 1 / -1; font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#qlist .q-empty { display: block; color: var(--muted); cursor: default; font-size: 13px; }
.ping { fill: none; stroke: var(--accent); stroke-width: 2; pointer-events: none; transform-box: fill-box; transform-origin: center; animation: ping 1.5s ease-out forwards; }
@keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(4); opacity: 0; } }
@media (hover: none) { .q-key { display: none; } }

/* per-language typography: the defaults above are for Chinese; every other language gets a Latin display face and
   tighter tracking (a language in another script, such as Japanese, would need rules of its own here) */
:root:not([lang|="zh"]) { --f-display: "Spectral", Georgia, serif; }
:root:not([lang|="zh"]) .brand h1 { letter-spacing: .01em; }
:root:not([lang|="zh"]) .label.big { letter-spacing: .05em; }
:root:not([lang|="zh"]) .phys-l.mt { letter-spacing: .14em; }
:root:not([lang|="zh"]) .phys-l.rv { letter-spacing: .04em; font-style: italic; }
:root:not([lang|="zh"]) .era, :root:not([lang|="zh"]) .tag { letter-spacing: .02em; }
.chip.lang { font-weight: 500; color: var(--ink); margin-left: auto; }

@media (max-width: 860px) {
  .app.side-first { grid-template-areas: "head" "map" "side" "time"; }
  .search { order: 5; flex-basis: 100%; max-width: none; }
  .chip.lang { order: -1; } /* level with the title, top right */
  .brand { order: -2; }
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "map" "time" "side"; }
  .mapwrap { height: 54vh; min-height: 300px; }
  aside { overflow: visible; }
  .brand h1 { font-size: 26px; }
  /* reading on a phone: the map stays pinned at the top while the text scrolls underneath */
  .app.reading { display: block; }
  .app.reading { --rd-map: max(32vh, 190px); }
  .app.reading .mapwrap { position: sticky; top: 0; z-index: 4; height: var(--rd-map); min-height: 0; }
  .app.reading aside { margin-top: 10px; }
  .rd-bar { top: var(--rd-map); }
  .rd-step { scroll-margin-top: calc(var(--rd-map) + 44px); padding-inline: 18px; }
  .rd-head, .rd-end { padding-inline: 18px; }
  .rd-end { padding-bottom: 45vh; }
  .year { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .pulse { animation: none; }
  .ev.pop path { animation: none; }
  .ping { animation: none; opacity: 0; }
  .poly, .lane-b { transition: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1 data-i18n="title">欧陆古今</h1>
      <p data-i18n="subtitle">欧洲历史地图 · 前700–2000</p>
    </div>
    <div class="modes" role="group" aria-label="模式" data-i18n-attr="aria-label:modes">
      <button data-mode="explore" aria-pressed="true" data-i18n="mode.explore">探索</button>
      <button data-mode="story" aria-pressed="false" data-i18n="mode.story">故事</button>
      <button data-mode="compare" aria-pressed="false" data-i18n="mode.compare">对比</button>
    </div>
    <div class="clock">
      <button class="btn" id="prev" aria-label="上一次边界更新" title="上一次边界更新（←）" data-i18n-attr="aria-label:prev,title:prevHint"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="yearbox"><div class="year"><span id="year">&nbsp;</span><small data-i18n="yearUnit">年</small></div><div class="era" id="era">&nbsp;</div></div>
      <button class="btn" id="next" aria-label="下一次边界更新" title="下一次边界更新（→）" data-i18n-attr="aria-label:next,title:nextHint"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="btn play" id="play" aria-label="播放" title="播放（空格）" data-i18n-attr="title:playHint"><svg viewBox="0 0 24 24" id="playicon"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    </div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="搜索国家、城市、事件" autocomplete="off" spellcheck="false"
        role="combobox" aria-expanded="false" aria-controls="qlist" aria-autocomplete="list" aria-label="搜索国家、城市、事件和故事"
        data-i18n-attr="placeholder:search.placeholder,aria-label:search.label">
      <kbd class="q-key">/</kbd>
      <ul id="qlist" role="listbox" aria-label="搜索结果" data-i18n-attr="aria-label:search.results" hidden></ul>
    </div>
    <button class="chip lang" id="lang" lang="en" title="切换语言" data-i18n-attr="title:lang">English</button>
  </header>

  <div class="mapwrap" id="mapwrap">
    <svg id="map" role="img" aria-label="欧洲历史疆域地图" data-i18n-attr="aria-label:map">
      <defs>
        <clipPath id="clip-a-land"><rect id="clip-a-land-r"></rect></clipPath>
        <clipPath id="clip-a-ov"><rect id="clip-a-ov-r"></rect></clipPath>
        <clipPath id="clip-b-ov"><rect id="clip-b-ov-r"></rect></clipPath>
        <pattern id="mtn" patternUnits="userSpaceOnUse" width="12" height="12">
          <path class="mtn-mark" d="M1 5L3.5 1.5L6 5M7 11L9.5 7.5L12 11"></path>
        </pattern>
        <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
          <rect class="hatch-bg" width="6" height="6"></rect>
          <line class="hatch-line" x1="1" y1="0" x2="1" y2="6"></line>
        </pattern>
      </defs>
    </svg>
    <div class="zoomctl">
      <button class="btn" id="layers-btn" aria-expanded="false" aria-controls="layers" aria-label="地图图层" title="地图图层" data-i18n-attr="aria-label:layers,title:layers"><svg viewBox="0 0 24 24"><path d="M12 4l8.5 4.5L12 13 3.5 8.5z"/><path d="M3.5 12.5L12 17l8.5-4.5M3.5 16.5L12 21l8.5-4.5"/></svg></button>
      <button class="btn" id="zin" aria-label="放大" data-i18n-attr="aria-label:zoomIn">+</button>
      <button class="btn" id="zout" aria-label="缩小" data-i18n-attr="aria-label:zoomOut">−</button>
      <button class="btn" id="zreset" aria-label="复位视图" title="复位视图" data-i18n-attr="aria-label:zoomReset,title:zoomReset"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg></button>
    </div>
    <div class="layers" id="layers" role="group" aria-label="地图图层" data-i18n-attr="aria-label:layers" hidden>
      <button class="chip" id="t-chg" aria-pressed="true"><i class="sw-chg"></i><span data-i18n="layer.chg">本期变化</span></button>
      <button class="chip" id="t-ev" aria-pressed="true"><i class="sw-ev"></i><span data-i18n="layer.ev">事件</span></button>
      <button class="chip" id="t-phys" aria-pressed="false"><i class="sw-phys"></i><span data-i18n="layer.phys">山川</span></button>
      <button class="chip" id="t-modern" aria-pressed="false"><i class="sw-modern"></i><span data-i18n="layer.modern">今日国界</span></button>
    </div>
    <div class="read-year" id="read-year"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="maphint" id="maphint" hidden data-i18n="twoFinger">用两指移动和缩放地图</div>
    <div class="loading" id="loading" data-i18n="loading">载入中 · Loading…</div>
  </div>

  <aside id="side" tabindex="-1"></aside>

  <div class="timewrap" id="timewrap">
    <button class="lanes-tog" id="lanes-tog" aria-expanded="false" aria-controls="tl"></button>
    <svg id="tl" role="slider" tabindex="0" aria-label="时间轴" data-i18n-attr="aria-label:timeline"></svg>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" integrity="sha512-vc58qvvBdrDR4etbxMdlTt4GBQk1qjvyORR2nrsPsFPyrs+/u5c3+1Ct6upOgdZoIl7eq6k3a1UPDSNAQi/32A==" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js" integrity="sha512-4UKI/XKm3xrvJ6pZS5oTRvIQGIzZFoXR71rRBb1y2N+PbwAsKa5tPl2J6WvbEvwN3TxQCm8hMzsl/pO+82iRlg==" crossorigin="anonymous"></script>
<script>
(async function () {
  const $ = s => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  // regions: each one is a folder under regions/ with its region.json, data and locales; ?region=<id> picks one
  const REGIONS = ["europe"];
  const RDIR = `regions/${REGIONS.includes(params.get("region")) ? params.get("region") : REGIONS[0]}`;
  // languages: each one is a locales/<code>.json file (the interface) plus regions/<id>/locales/<code>.json (the content)
  const LOCALES = { zh: ["中文", "zh-CN"], en: ["English", "en"] }; // code: [native name, BCP 47 tag]
  const LANG_KEY = "chronica.lang", LANES_KEY = "chronica.lanes";
  // ?lang=<code> in the address, else the language last picked with the language button, else the first of the
  // browser's preferred languages that the atlas has (zh-TW counts as zh), else English
  const known = code => Object.hasOwn(LOCALES, code);
  function pickLang() {
    if (known(params.get("lang"))) return params.get("lang");
    try {
      const saved = localStorage.getItem(LANG_KEY);
      if (known(saved)) return saved;
    } catch (e) { /* storage unavailable */ }
    for (const l of navigator.languages || [navigator.language || ""]) {
      const code = String(l).toLowerCase().split("-")[0];
      if (known(code)) return code;
    }
    return "en";
  }
  const getJSON = url => fetch(url).then(r => {
    if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
    return r.json();
  });
  const pData = Promise.all([
    getJSON(`${RDIR}/region.json`),
    getJSON(`${RDIR}/borders.json`),
    getJSON(`${RDIR}/physical.json`).catch(() => null),
    getJSON(`${RDIR}/events.json`),
    getJSON(`${RDIR}/stories.json`),
    getJSON(`${RDIR}/cities.json`),
  ]);
  pData.catch(() => {}); // a failure surfaces where it is awaited below
  // A locale is the interface text with the region's content laid over it, section by section (the region's "ui"
  // adds its title). A region not yet translated into the language shows its English content.
  // sections a region may leave out: a missing name falls back to the source's English name, a missing text to its key
  const SECTIONS = ["types", "lanes", "lineages", "notes", "presets", "names", "short", "cities", "rivers", "ranges", "events", "stories", "aliases"];
  const complete = loc => {
    for (const k of SECTIONS) loc[k] = loc[k] || {};
    for (const k of ["eras", "erasShort", "periods"]) loc[k] = loc[k] || [];
    return loc;
  };
  const regionText = code => getJSON(`${RDIR}/locales/${code}.json`).catch(e => code === "en" ? Promise.reject(e) : regionText("en"));
  async function loadLocale(code) {
    const [base, region] = await Promise.all([getJSON(`locales/${code}.json`), regionText(code)]);
    const out = { ...base };
    for (const [k, v] of Object.entries(region)) out[k] = base[k] && typeof v === "object" && !Array.isArray(v) ? { ...base[k], ...v } : v;
    return complete(out);
  }
  let LOC = await loadLocale(pickLang()); // the active locale; setLang() swaps it

  // UI text with {name} placeholders; params go in as given, so escape anything that comes from data first
  const tr = (key, params) => String(LOC.ui[key] ?? key).replace(/\{(\w+)\}/g, (m, k) => params && params[k] != null ? params[k] : "");
  const srcName = key => String(key).split("|")[0];
  // display name of a polity key; a missing translation falls back to the source data's (English) name
  const pname = key => LOC.names[key] ?? LOC.names[srcName(key)] ?? srcName(key);
  const typeName = type => LOC.types[type] ?? type;
  const cityLabel = key => LOC.cities[key] ?? key;
  // static text goes in before the 1.3 MB borders file has arrived, so the page starts in the right language
  function applyText() {
    document.documentElement.lang = LOC.meta.lang;
    document.title = tr("title");
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = tr(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-attr]").forEach(el => {
      for (const pair of el.dataset.i18nAttr.split(",")) {
        const [attr, key] = pair.split(":");
        el.setAttribute(attr, tr(key));
      }
    });
    // the language button names the next language in the list
    const codes = Object.keys(LOCALES), next = codes[(codes.indexOf(LOC.meta.code) + 1) % codes.length], btn = $("#lang");
    [btn.textContent, btn.lang] = LOCALES[next];
    btn.dataset.next = next;
    document.documentElement.classList.add("i18n");
  }
  applyText();
  const [RC, data, phys, eventRows, storyRows, cityRows] = await pData; // RC: the region's region.json

  const YEARS = data.years, LIN = data.lineages, IDENTS = data.idents, CHANGES = data.changes, topo = data.topo;
  // in year order whatever the file's order: "upcoming" and compare's "between" take the first ones
  const EVENTS = eventRows.slice().sort((a, b) => a[1] - b[1]).map(([key, year, lat, lon, type], id) => ({ id, key, year, lat, lon, type, title: key, note: "" }));
  const CITIES = cityRows.map(c => ({ lat: c[0], lon: c[1], rank: c[2], names: c[3] }));

  const TYPES = {
    war: { sym: d3.symbolDiamond }, treaty: { sym: d3.symbolSquare }, politics: { sym: d3.symbolCircle },
    faith: { sym: d3.symbolTriangle }, culture: { sym: d3.symbolStar }, plague: { sym: d3.symbolCross },
  };
  // years are integers, negative for BC (-500 is 500 BC); there is no year 0
  const Y0 = YEARS[0], YN = RC.end, START = RC.start;
  const ERAS = RC.eras.slice(1).map((b, i) => [RC.eras[i], b]); // names: LOC.eras
  // piecewise-linear time scale: [year, share of the timeline]; sparse early centuries compressed, dense ones stretched
  const SEG = RC.scale;
  // lineage colours [light, dark], in the order of the timeline lanes
  const LANES = Object.keys(RC.lineages);
