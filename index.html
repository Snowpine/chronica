      rows.push({ x, y, nm: free ? nm : "", now: free ? now : "" });
    }
    const g = gCities.selectAll("g.city").data(rows).join(enter => {
      const e = enter.append("g").attr("class", "city");
      e.append("circle").attr("r", 2.6);
      const t = e.append("text").attr("x", 6).attr("dy", "0.35em");
      t.append("tspan").attr("class", "nm");
      t.append("tspan").attr("class", "now").attr("x", 6).attr("dy", "1.2em");
      return e;
    });
    g.attr("transform", d => `translate(${d.x},${d.y})`);
    g.select("tspan.nm").text(d => d.nm);
    g.select("tspan.now").text(d => d.now);
  }

  function visibleEvents() {
    const Y = state.year, selId = state.sel && state.sel.kind === "event" ? state.sel.id : -1;
    const storyIds = (curStep() || {}).evIds || [];
    return EVENTS.filter(e => e.id === selId || storyIds.includes(e.id) || (state.show.ev && !comparing() && e.year <= Y && e.year > Y - windowAt(Y)));
  }
  function renderEvents() {
    const Y = state.year, selId = state.sel && state.sel.kind === "event" ? state.sel.id : -1;
    const vis = visibleEvents().map(e => {
      const [x, y] = zt.apply(proj([e.lon, e.lat]));
      return { e, x, y, age: Math.max(0, Y - e.year) };
    });
    const storyIds = new Set((curStep() || {}).evIds || []);
    const labelled = new Set(vis.filter(d => d.age <= windowAt(Y) / 4).sort((a, b) => a.age - b.age).slice(0, storyIds.size ? 1 : 3).map(d => d.e.id));
    storyIds.forEach(id => labelled.add(id));
    if (selId >= 0) labelled.add(selId);
    const g = gEvents.selectAll("g.ev").data(vis, d => d.e.id).join(
      enter => {
        const e = enter.append("g").attr("class", "ev pop");
        e.append("path").attr("d", d => d3.symbol((TYPES[d.e.type] || TYPES.politics).sym, d.e.type === "culture" ? 90 : 70)()); // an unknown type: a circle
        e.append("text").attr("dy", "0.35em");
        setTimeout(() => e.classed("pop", false), 600);
        return e;
      });
    g.attr("transform", d => `translate(${d.x},${d.y})`)
      .attr("opacity", d => d.e.id === selId ? 1 : 1 - Math.min(1, d.age / windowAt(Y)) * .7)
      .classed("now", d => d.age <= 1 || storyIds.has(d.e.id))
      .classed("sel", d => d.e.id === selId);
    const boxes = labelBoxes.concat(cityBoxes);
    occupied = boxes;
    const order = vis.filter(d => labelled.has(d.e.id))
      .sort((a, b) => (b.e.id === selId) - (a.e.id === selId) || storyIds.has(b.e.id) - storyIds.has(a.e.id) || a.age - b.age);
    const pos = new Map();
    for (const d of order) {
      const w = textW(d.e.title, 12) + 4, x = d.x, y = d.y;
      const opts = [[x + 9, y - 8, x + 9 + w, y + 8, "start", 9, 0], [x - 9 - w, y - 8, x - 9, y + 8, "end", -9, 0],
        [x - w / 2, y - 26, x + w / 2, y - 10, "middle", 0, -18], [x - w / 2, y + 10, x + w / 2, y + 26, "middle", 0, 18]];
      const inside = b => b[0] >= 2 && b[2] <= W - 2 && b[1] >= 2 && b[3] <= H - 2;
      let o = opts.find(b => inside(b) && !boxes.some(q => q[0] < b[2] && b[0] < q[2] && q[1] < b[3] && b[1] < q[3]));
      if (!o && (d.e.id === selId || storyIds.has(d.e.id))) o = opts[0];
      if (!o) continue;
      boxes.push(o);
      pos.set(d.e.id, o);
    }
    g.select("text")
      .text(d => pos.has(d.e.id) ? d.e.title : "")
      .attr("x", d => pos.has(d.e.id) ? pos.get(d.e.id)[5] : 9)
      .attr("y", d => pos.has(d.e.id) ? pos.get(d.e.id)[6] : 0)
      .attr("text-anchor", d => pos.has(d.e.id) ? pos.get(d.e.id)[4] : "start");
    g.filter(d => d.e.id === selId).raise();
    placePhysLabels();
  }

  function placePhysLabels() {
    const k = zt.k, out = [], boxes = occupied.slice();
    if (phys && state.show.phys) {
      const free = b => !boxes.some(q => q[0] < b[2] && b[0] < q[2] && q[1] < b[3] && b[1] < q[3]);
      const mtMin = [0, .9, .9, 1.5, 2.3, 3.2], tracking = LOC.meta.code === "zh" ? 3.5 : 1.5;
      for (const [key, lon, lat, rank] of phys.rangeLabels.slice().sort((a, b) => a[3] - b[3])) {
        if (k < mtMin[rank]) continue;
        const label = LOC.ranges[key] || key;
        const [x, y] = zt.apply(proj([lon, lat])), w = textW(label, 11) + label.length * tracking;
        const b = [x - w / 2, y - 8, x + w / 2, y + 8];
        if (x < 0 || x > W || y < 0 || y > H || !free(b)) continue;
        boxes.push(b);
        out.push({ cls: "phys-l mt", label, x, y, a: 0 });
      }
      for (const [key, lon, lat, lon2, lat2, rank] of phys.riverLabels.slice().sort((a, b) => a[5] - b[5])) {
        if (k < (rank <= 4 ? 1.3 : rank <= 6 ? 2 : 3)) continue;
        const label = LOC.rivers[key] || key;
        const [x1, y1] = zt.apply(proj([lon, lat])), [x2, y2] = zt.apply(proj([lon2, lat2]));
        let a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
        if (a > 90) a -= 180;
        if (a < -90) a += 180;
        const x = (x1 + x2) / 2, y = (y1 + y2) / 2, w = textW(label, 11) + label.length * 2, r = a * Math.PI / 180;
        const hw = Math.abs(w / 2 * Math.cos(r)) + Math.abs(7 * Math.sin(r)), hh = Math.abs(w / 2 * Math.sin(r)) + Math.abs(7 * Math.cos(r));
        const b = [x - hw, y - hh, x + hw, y + hh];
        if (x < 0 || x > W || y < 0 || y > H || !free(b)) continue;
        boxes.push(b);
        out.push({ cls: "phys-l rv", label, x, y, a });
      }
    }
    gPhysLabels.selectAll("text").data(out).join("text")
      .attr("class", d => d.cls)
      .attr("transform", d => `translate(${d.x},${d.y}) rotate(${d.a.toFixed(1)})`)
      .text(d => d.label);
  }

  let overlayQueued = false;
  function scheduleOverlay() {
    if (overlayQueued) return;
    overlayQueued = true;
    requestAnimationFrame(() => { overlayQueued = false; placeLabels(); renderCities(); renderEvents(); });
  }

  // tooltips
  function showTip(html, ev) {
    tip.innerHTML = html;
    tip.hidden = false;
    const r = mapEl.getBoundingClientRect();
    let x = ev.clientX - r.left + 14, y = ev.clientY - r.top + 14;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    if (x + tw > r.width - 8) x = ev.clientX - r.left - tw - 14;
    if (y + th > r.height - 8) y = ev.clientY - r.top - th - 14;
    tip.style.transform = `translate(${Math.max(4, x)}px,${Math.max(4, y)}px)`;
  }
  const hideTip = () => { tip.hidden = true; };
  function polyTip(p) {
    if (p.i === "_none") return `<b>${esc(pname("_none"))}</b>`;
    const name = pname(p.n), src = srcName(p.n);
    return `<b>${esc(name)}</b>` + (LOC.meta.code !== "en" && src !== name ? `<span>${esc(src)}</span>` : "") +
      (p.o ? `<span>${esc(tr("overlord", { name: pname(p.o) }))}</span>` : "") + `<span>${esc(approx(p.a))}</span>`;
  }
  const chgTip = p => `<b>${esc(tr("changeRow", { to: pname(p.toK), from: pname(p.fromK) }))}</b>` +
    `<span>${esc(tr("snapRange", { a: fy(YEARS[state.snap - 1]), b: fy(YEARS[state.snap]) }))} · ${esc(approx(p.a))}</span>`;
  const evTip = e => `<b>${fy(e.year)} · ${esc(e.title)}</b><span>${esc(typeName(e.type))}</span>`;

  svg.on("pointermove", ev => {
    if (ev.pointerType === "touch") return;
    const t = ev.target, evG = t.closest && t.closest(".ev");
    if (evG) return showTip(evTip(d3.select(evG).datum().e), ev);
    const d = t.__data__;
    if (d && t.classList.contains("chg")) return showTip(chgTip(d.properties), ev);
    if (d && t.classList.contains("poly")) return showTip(polyTip(d.properties), ev);
    hideTip();
  }).on("pointerleave", hideTip);

  svg.on("click", ev => {
    const t = ev.target, evG = t.closest && t.closest(".ev");
    if (evG) return select({ kind: "event", id: d3.select(evG).datum().e.id });
    const d = t.__data__;
    if (d && t.classList.contains("chg")) return select({ kind: "ident", id: d.properties.to });
    if (d && t.classList.contains("poly") && d.properties.i !== "_none") return select({ kind: "ident", id: d.properties.i, side: gLandA.node().contains(t) ? "a" : "b" });
    if (t.closest && t.closest(".cmp-div")) return; // a click on the compare divider is not a click on the map
    select(null);
  });

  const motion = ms => matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : ms;
  // a zoom to a target computed for the map's current size; again() computes and starts it afresh after a refit
  function aim(t, ms, again) {
    goal = again;
    svg.transition().duration(motion(ms)).call(zoom.transform, t).on("end", () => { if (goal === again) goal = null; });
  }
  function zoomToFeature(f) {
    const [[x0, y0], [x1, y1]] = path.bounds(f);
    const k = Math.max(.5, Math.min(6, .7 / Math.max((x1 - x0) / W, (y1 - y0) / H)));
    aim(d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k), 700, () => zoomToFeature(f));
  }
  function zoomToPoint(lon, lat) {
    const [x, y] = proj([lon, lat]), k = Math.max(zt.k, 3);
    aim(d3.zoomIdentity.translate(W / 2 - k * x, H / 2 - k * y).scale(k), 700, () => zoomToPoint(lon, lat));
  }
  $("#zin").onclick = () => { goal = null; svg.transition().duration(motion(300)).call(zoom.scaleBy, 1.6); };
  $("#zout").onclick = () => { goal = null; svg.transition().duration(motion(300)).call(zoom.scaleBy, 1 / 1.6); };
  $("#zreset").onclick = () => { goal = null; svg.transition().duration(motion(500)).call(zoom.transform, d3.zoomIdentity); };

  // ---------- timeline ----------
  const tl = d3.select("#tl");
  let TL = null;

  function drawTimeline() {
    const w = $("#timewrap").clientWidth;
    if (!w) return;
    const narrow = w < 640;
    // the lanes are folded away by default, leaving eras, event density and the axis
    const lanes = state.lanes ? LANES : [];
    const G = narrow ? 82 : 104, X0 = G, X1 = w - 14, laneH = narrow ? 11 : 12;
    const eraY = 2, eraH = 20, lanesY = eraY + eraH + 6, lanesH = lanes.length * laneH;
    const denY = lanesY + lanesH + (lanes.length ? 6 : 0), denH = 26, axisY = denY + denH + 2, TH = axisY + 18;
    const X = y => X0 + tf(y) * (X1 - X0);
    TL = { w, G, X0, X1, laneH, lanesY, denY, denH, axisY, TH, X };
    tl.attr("viewBox", `0 0 ${w} ${TH}`).attr("height", TH).attr("aria-valuemin", Y0).attr("aria-valuemax", YN);
    tl.selectAll("*").remove();
    const selLin = state.sel && state.sel.kind === "lineage" ? state.sel.id : null;
    tl.append("rect").attr("class", "snap-span").attr("y", eraY).attr("height", axisY - eraY).attr("rx", 3);
    const chapter = state.story && STORIES[state.story.ch];
    if (chapter) {
      const ys = chapter.steps.map(st => st.y), a = Math.min(...ys), b = Math.max(...ys);
      tl.append("rect").attr("class", "story-band").attr("x", X(a) - 4).attr("width", Math.max(8, X(b) - X(a) + 8))
        .attr("y", eraY).attr("height", axisY - eraY).attr("rx", 4);
    }

    // Each era is labelled with its name, or its short name, if one fits. When some era of a period (region.json
    // "periods") has no name that fits, as on a phone, the period's eras merge into one bar under the period's name.
    const gE = tl.append("g"), probe = gE.append("text").attr("class", "era-t"); // measures names in the label font
    const fits = (name, a, b) => !!name && X(b) - X(a) > probe.text(name).node().getComputedTextLength() + 8;
    const eras = ERAS.map(([a, b], i) => ({ a, b, name: [LOC.eras[i], LOC.erasShort[i]].find(n => fits(n, a, b)) }));
    const periods = (RC.periods || []).slice(1).map((b, j) => ({ a: RC.periods[j], b, name: LOC.periods[j] }));
    const bars = [];
    for (const e of eras) {
      const p = periods.find(p => e.a >= p.a && e.b <= p.b);
      if (!p || eras.every(o => o.a < p.a || o.b > p.b || o.name)) bars.push(e);
      else if (!bars.includes(p)) bars.push(Object.assign(p, { name: fits(p.name, p.a, p.b) ? p.name : "" }));
    }
    probe.remove();
    bars.forEach(({ a, b, name }, i) => {
      gE.append("rect").attr("class", "era-r").attr("x", X(a)).attr("y", eraY).attr("width", X(b) - X(a)).attr("height", eraH)
        .attr("rx", 3).style("fill", i % 2 ? "var(--era-b)" : "var(--era-a)");
      if (name) gE.append("text").attr("class", "era-t").attr("x", (X(a) + X(b)) / 2).attr("y", eraY + eraH / 2).text(name);
    });
    const tog = $("#lanes-tog");
    tog.textContent = tr("tl.lanesToggle");
    tog.title = tr("tl.lanes");
    tog.setAttribute("aria-expanded", state.lanes);
    tog.style.right = `${w - G + (narrow ? 6 : 8)}px`;

    const LANE_CAP = 3e6; // km²; the largest empires saturate so mid-sized powers stay readable
    const gL = tl.append("g");
    lanes.forEach((id, i) => {
      const cy = lanesY + i * laneH + laneH / 2, s = LIN[id].s;
      if (selLin === id) gL.append("rect").attr("class", "lane-sel").attr("x", 0).attr("y", cy - laneH / 2).attr("width", w).attr("height", laneH).attr("rx", 3);
      const hh = v => v > 0 ? Math.max(3, (laneH - 2) * Math.sqrt(Math.min(1, v / LANE_CAP))) / 2 : 0;
      const pts = YEARS.map((y, j) => [X(y), s[j]]);
      pts.push([X(YN), s[s.length - 1]]);
      const area = d3.area().x(d => d[0]).y0(d => cy - hh(d[1])).y1(d => cy + hh(d[1])).curve(d3.curveStepAfter);
      gL.append("path").attr("class", "lane-b" + (selLin && selLin !== id ? " dim" : "")).attr("d", area(pts)).style("fill", `var(--lin-${id})`);
      const lane = LOC.lanes[id] || id, label = narrow ? lane.split("/").pop() : lane;
      gL.append("text").attr("class", "lane-l" + (selLin === id ? " on" : "")).attr("x", G - 8).attr("y", cy)
        .text(label).on("click", () => select(selLin === id ? null : { kind: "lineage", id }));
    });

    const gD = tl.append("g");
    // decades from denseFrom on; half-centuries before, where the scale is compressed
    const bins = [];
    for (let b = Y0; b < YN; b += b < DENSE ? 50 : 10) bins.push({ b, e: b + (b < DENSE ? 50 : 10) });
    bins.forEach(o => { o.n = EVENTS.filter(e => e.year >= o.b && e.year < o.e).length; });
    const maxN = d3.max(bins, d => d.n) || 1;
    bins.forEach(({ b, e, n }) => {
      if (!n) return;
      const h = 2 + n / maxN * (denH - 8);
      gD.append("rect").attr("class", "den").attr("x", X(b)).attr("width", Math.max(1, X(e) - X(b) - .6))
        .attr("y", denY + denH - h).attr("height", h);
    });
    const totals = YEARS.map(y => d3.sum(CHANGES[y] || [], c => c.a));
    const maxT = d3.max(totals) || 1;
    YEARS.forEach((y, i) => {
      if (!i) return;
      const h = totals[i] ? 5 + Math.sqrt(totals[i] / maxT) * (denH - 9) : 3;
      const g = gD.append("g");
      g.append("line").attr("class", "ctick").attr("x1", X(y)).attr("x2", X(y)).attr("y1", denY + denH).attr("y2", denY + denH - h);
      g.append("circle").attr("class", "ctick-d").attr("cx", X(y)).attr("cy", denY + denH - h).attr("r", 2.2);
    });
    const den = tr("tl.density"); // "Events · changes": keep only the first part where the label column is narrow
    gD.append("text").attr("class", "row-l").attr("x", G - 8).attr("y", denY + denH / 2).text(textW(den, 10.5) > G - 10 ? den.split(" · ")[0] : den);

    const gA = tl.append("g");
    gA.append("line").attr("class", "axis-l").attr("x1", X0).attr("x2", X1).attr("y1", axisY).attr("y2", axisY);
    const centuries = d3.range(Math.ceil(Y0 / 100) * 100, YN + 1, 100);
    centuries.forEach(y =>
      gA.append("line").attr("class", "axis-l").attr("x1", X(y)).attr("x2", X(y)).attr("y1", axisY).attr("y2", axisY + 4));
    // century labels in order of importance, skipping any that would collide: the two ends, round thousands and five
    // hundreds, then the centuries with the most room on the scale (compressed early centuries come last)
    const rank = y => y % 1000 === 0 ? 0 : y % 500 === 0 ? 1 : 2, room = y => tf(y + 50) - tf(y - 50);
    const labelled = centuries.filter(y => y && y !== Y0 && y !== YN).sort((a, b) => rank(a) - rank(b) || room(b) - room(a));
    const taken = [];
    for (const y of [Y0, YN, ...labelled]) {
      const anchor = y === Y0 ? "start" : y === YN ? "end" : "middle", lw = textW(fy(y), 11);
      const a = anchor === "start" ? X(y) : anchor === "end" ? X(y) - lw : X(y) - lw / 2;
      if (taken.some(([p, q]) => a < q + 6 && p < a + lw + 6)) continue;
      taken.push([a, a + lw]);
      gA.append("text").attr("class", "axis-t").attr("x", X(y)).attr("y", axisY + 14).attr("text-anchor", anchor).text(fy(y));
    }

    const ghost = tl.append("g").attr("class", "ghostg").style("display", "none");
    ghost.append("line").attr("class", "ghost").attr("y1", eraY).attr("y2", axisY);
    ghost.append("text").attr("class", "ghost-t").attr("y", denY - 2);
    const ph = tl.append("g").attr("class", "ph");
    ph.append("line").attr("class", "ph-line").attr("y1", eraY).attr("y2", axisY);
    ph.append("circle").attr("class", "ph-knob").attr("cy", axisY).attr("r", 5);
    const phA = tl.append("g").attr("class", "ph-a").style("display", comparing() ? null : "none");
    phA.append("line").attr("class", "ph-a-line").attr("y1", eraY).attr("y2", axisY);
    phA.append("circle").attr("class", "ph-a-knob").attr("cy", axisY).attr("r", 5);

    const hit = tl.append("rect").attr("x", X0 - 6).attr("y", 0).attr("width", X1 - X0 + 12).attr("height", TH).style("fill", "transparent").style("cursor", "ew-resize");
    let drag = null;
    const yearAt = px => Math.round(ty(Math.max(0, Math.min(1, (px - X0) / (X1 - X0)))));
    hit.on("pointerdown", ev => {
      ev.preventDefault();
      hit.node().setPointerCapture(ev.pointerId);
      const [px, py] = d3.pointer(ev, tl.node());
      // in compare mode, grabbing near the grey playhead moves the left year
      const nearA = comparing() && Math.abs(px - X(state.yearA)) < 16 && Math.abs(px - X(state.yearA)) < Math.abs(px - X(state.year));
      drag = { x0: px, y0: py, moved: false, set: nearA ? setYearA : setYear };
      ghost.style("display", "none");
    }).on("pointermove", ev => {
      const [px] = d3.pointer(ev, tl.node());
      if (drag) {
        if (!drag.moved && Math.abs(px - drag.x0) > 3) {
          drag.moved = true;
          stopPlay();
        }
        if (drag.moved) drag.set(yearAt(px));
      } else if (ev.pointerType !== "touch") {
        const y = yearAt(px);
        ghost.style("display", null).attr("transform", `translate(${X(y)},0)`);
        ghost.select("text").attr("x", X(y) > X1 - 40 ? -4 : 4).attr("text-anchor", X(y) > X1 - 40 ? "end" : "start").text(fy(y));
      }
    }).on("pointerup", () => {
      if (drag && !drag.moved) {
        const i = Math.floor((drag.y0 - lanesY) / laneH);
        if (i >= 0 && i < lanes.length) select(selLin === lanes[i] ? null : { kind: "lineage", id: lanes[i] });
        else {
          stopPlay();
          drag.set(yearAt(drag.x0));
        }
      }
      drag = null;
    }).on("pointercancel", () => { drag = null; }).on("pointerleave", () => ghost.style("display", "none"));
    if (chapter) {
      const gS = tl.append("g");
      chapter.steps.forEach((st, i) => {
        const dup = chapter.steps.slice(0, i).filter(o => o.y === st.y).length;
        gS.append("circle").attr("class", "sdot" + (i === state.story.step ? " on" : ""))
          .attr("cx", X(st.y) + dup * 11).attr("cy", eraY + eraH / 2).attr("r", i === state.story.step ? 6 : 4.5)
          .on("click", () => goStep(i))
          .append("title").text(`${fy(st.y)} · ${st.t}`);
      });
    }
    movePlayhead();
  }

  $("#lanes-tog").onclick = () => {
    state.lanes = !state.lanes;
    try { localStorage.setItem(LANES_KEY, state.lanes ? "1" : "0"); } catch (e) { /* storage unavailable */ }
    drawTimeline();
  };

  function movePlayhead() {
    if (!TL) return;
    tl.select(".ph").attr("transform", `translate(${TL.X(state.year)},0)`);
    if (comparing() && state.yearA != null) tl.select(".ph-a").attr("transform", `translate(${TL.X(state.yearA)},0)`);
    if (state.snap >= 0) {
      const a = TL.X(YEARS[state.snap]), b = TL.X(YEARS[state.snap + 1] ?? YN);
      tl.select(".snap-span").attr("x", a).attr("width", Math.max(2, b - a));
    }
    tl.attr("aria-valuenow", state.year).attr("aria-valuetext", tr("yearAria", { y: fy(state.year) }));
  }

  // ---------- side panel ----------
  const side = $("#side");
  let sideKey = "";

  function recentEvents() {
    const Y = state.year;
    return EVENTS.filter(e => e.year <= Y && e.year > Y - windowAt(Y)).sort((a, b) => b.year - a.year || b.id - a.id).slice(0, 8);
  }
  const recentRange = Y => { const a = Math.max(Y0, Y - windowAt(Y) + 1); return fyr(a || 1, Y); };
  function upcomingEvents() { return EVENTS.filter(e => e.year > state.year).slice(0, 2); }
  const linSwatch = id => {
    const l = IDENTS[id] && IDENTS[id].l;
    const f = feats.find(f => f.properties.i === id);
    if (f) return fillOf(f.properties);
    return l ? `var(--lin-${l})` : `var(--n${hash(id) % 5})`;
  };

  const sparkX = y => 4 + tf(y) * 292; // 300 wide, 4 padding
  function spark(s, color) {
    const w = 300, h = 66, pad = 4, max = d3.max(s) || 1;
    const X = sparkX, Y = v => h - pad - v / max * (h - 2 * pad - 14);
    const pts = YEARS.map((y, i) => [X(y), Y(s[i])]);
    pts.push([X(YN), Y(s[s.length - 1])]);
    const line = d3.line().curve(d3.curveStepAfter)(pts);
    const area = d3.area().x(d => d[0]).y0(h - pad).y1(d => d[1]).curve(d3.curveStepAfter)(pts);
    const pk = s.indexOf(max);
    const now = (cls, y) => `<line class="${cls}" x1="${X(y)}" x2="${X(y)}" y1="12" y2="${h}"></line>`;
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(tr("spark.label"))}">
      <path d="${area}" style="fill:${color};opacity:.45"></path>
      <path d="${line}" style="fill:none;stroke:${color};stroke-width:1.6"></path>
      ${comparing() ? now("spark-now a", state.yearA) : ""}${now("spark-now b", state.year)}
      <text class="spark-t" x="${pad}" y="10">${esc(tr("spark.peak", { area: fmtArea(max), y: fy(YEARS[pk]) }))}</text></svg>`;
  }
  const runsList = runs => `<ol class="runs">${runs.map(r =>
    `<li><span>${esc(pname(r[0]))}</span><span class="yr">${fyr(r[1], r[2])}</span></li>`).join("")}</ol>`;

  function selCard() {
    const s = state.sel;
    if (!s) return "";
    const top = tag => `<div class="card-top"><span class="tag">${esc(tag)}</span><button class="x" data-act="close" aria-label="${esc(tr("close"))}">×</button></div>`;
    if (s.kind === "event") {
      const e = EVENTS[s.id];
      return `<div class="card">${top(typeName(e.type))}<div class="cy">${fy(e.year)}</div><h4>${esc(e.title)}</h4><p>${esc(e.note)}</p>
        <button class="link" data-act="locate">${esc(tr("locate"))}</button></div>`;
    }
    // compare mode describes both snapshots, left year first
    const snaps = comparing() ? [[state.snapA, featsA], [state.snap, feats]] : [[state.snap, feats]];
    if (s.kind === "lineage") {
      const lin = LIN[s.id];
      const metas = snaps.map(([si]) => `<p class="meta">${esc(lin.s[si] ? tr("lineageMeta", { y: fy(YEARS[si]), area: fmtArea(lin.s[si]) }) : tr("absent", { y: fy(YEARS[si]) }))}</p>`).join("");
      return `<div class="card">${top(tr("tag.lineage"))}<h4>${esc(LOC.lineages[s.id] || s.id)}</h4>${metas}
        ${spark(lin.s, `var(--lin-${s.id})`)}<h3>${esc(tr("nameHistory"))}</h3>${runsList(lin.names)}</div>`;
    }
    const info = IDENTS[s.id];
    if (!info) return "";
    const per = snaps.map(([si, list]) => ({ y: YEARS[si], p: (list.filter(f => f.properties.i === s.id).sort((a, b) => b.properties.a - a.properties.a)[0] || {}).properties }));
    // name the state as it was on the side that was clicked (the right one unless the click was on the left)
    const p = (s.side === "a" ? per[0] : per[per.length - 1]).p || (per.find(o => o.p) || {}).p;
    const key = p ? p.n : info.names[info.names.length - 1][0];
    const name = pname(key), src = srcName(key), color = info.l ? `var(--lin-${info.l})` : "var(--faint)";
    const metas = per.map(o => `<p class="meta">${esc(o.p ? tr("stateMeta", { y: fy(o.y), area: fmtArea(o.p.a) }) : tr("absent", { y: fy(o.y) }))}</p>`).join("");
    return `<div class="card">${top(tr("tag.state"))}<h4>${esc(name)}</h4>${LOC.meta.code !== "en" && src !== name ? `<p class="en">${esc(src)}</p>` : ""}
      ${p && p.o ? `<p>${esc(tr("overlord", { name: pname(p.o) }))}</p>` : ""}
      ${metas}
      ${spark(info.s, color)}<h3>${esc(tr("nameHistory"))}</h3>${runsList(info.names)}
      ${info.l ? `<button class="link" data-act="lineage" data-id="${info.l}"><i style="background:var(--lin-${info.l})"></i>${esc(tr("viewLineage", { name: LOC.lineages[info.l] || info.l }))}</button>` : ""}</div>`;
  }

  function changesSec() {
    const y = YEARS[state.snap], prev = YEARS[state.snap - 1];
    if (!prev) return `<section><h2>${esc(tr("changes"))} <span>${esc(tr("changes.first"))}</span></h2><p class="empty">${esc(tr("changes.firstNote", { y: fy(y) }))}</p></section>`;
    // changes in the region's core (region.json) come before those at the edges of the map window
    const [[cw, cs0], [ce, cn]] = RC.core || RC.window, core = c => c.x > cw && c.x < ce && c.y > cs0 && c.y < cn;
    const cs = (CHANGES[y] || []).map((c, k) => ({ ...c, k })).sort((a, b) => core(b) - core(a) || b.a - a.a);
    const noteText = LOC.notes[y];
    const note = noteText ? `<p class="note">${esc(noteText)}</p>` : "";
    // the three largest first; the rest of the top ten one click away
    const shown = state.chgAll ? 10 : 3, hidden = Math.min(cs.length, 10) - shown;
    const rows = cs.slice(0, shown).map(c => `<button class="row" data-act="chg" data-k="${c.k}">
        <i class="sw" style="background:${linSwatch(c.to)}"></i>
        <span>${tr("changeRow", { to: `<b>${esc(pname(c.toK))}</b>`, from: esc(pname(c.fromK)) })}<small>${esc(approx(c.a))}</small></span></button>`).join("");
    const more = hidden > 0 ? `<button class="link" data-act="chg-all">${esc(tr("changes.showAll", { n: hidden }))}</button>`
      : cs.length > 10 ? `<p class="more">${esc(tr("changes.more", { n: cs.length - 10 }))}</p>` : "";
    const off = state.show.chg ? "" : `<p class="more">${esc(tr("changes.off"))}</p>`;
    return `<section><h2>${esc(tr("changes"))} <span>${esc(tr("snapRange", { a: fy(prev), b: fy(y) }))}</span></h2>${note}${rows || (noteText ? "" : `<p class="empty">${esc(tr("changes.none"))}</p>`)}${more}${off}</section>`;
  }

  function eventsSec() {
    const Y = state.year, rec = recentEvents(), up = upcomingEvents();
    const row = (e, cls) => `<button class="row ${cls}" data-act="ev" data-id="${e.id}"><span class="yr">${fy(e.year)}</span>
      <span><b>${esc(e.title)}</b><small>${esc(typeName(e.type))} · ${esc(e.note)}</small></span></button>`;
    return `<section><h2>${esc(tr("recent"))} <span class="rng">${recentRange(Y)}</span></h2>
      ${rec.length ? rec.map(e => row(e, "")).join("") : `<p class="empty">${esc(tr("recent.none", { n: windowAt(Y) }))}</p>`}
      ${up.length ? `<h3>${esc(tr("upcoming"))}</h3>${up.map(e => row(e, "later")).join("")}` : ""}</section>`;
  }

  function footer() {
    const leg = Object.entries(TYPES).map(([type, def]) =>
      `<span><svg viewBox="-7 -7 14 14"><path d="${d3.symbol(def.sym, 60)()}"></path></svg>${esc(typeName(type))}</span>`).join("");
    const link = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
    const credit = tr("credit", {
      hb: link("https://github.com/aourednik/historical-basemaps", "aourednik/historical-basemaps"),
      ne: link("https://www.naturalearthdata.com/", "Natural Earth"), n: YEARS.length, events: EVENTS.length,
    });
    return `<section><div class="legend">${leg}</div><p class="credit">${credit}</p><p class="keys">${tr("keys")}</p></section>`;
  }

  function storySec() {
    if (state.mode !== "story") return "";
    if (!state.story) {
      return `<section class="stories"><h2>${esc(tr("stories"))} <span>${esc(tr("stories.count", { n: STORIES.length }))}</span></h2>${STORIES.map((c, i) =>
        `<button class="chapter" data-act="chapter" data-i="${i}"><span class="ch-yr">${fyr(...c.span)}</span><b>${esc(c.title)}</b>
          <span class="ch-n">${esc(tr("story.steps", { n: c.steps.length }))}${hasLong(c) ? ` · ${esc(tr("story.full"))}` : ""}</span><small>${esc(c.lede)}</small></button>`).join("")}</section>`;
    }
    const c = STORIES[state.story.ch], i = state.story.step, st = c.steps[i], last = i === c.steps.length - 1;
    const nextCh = STORIES[state.story.ch + 1];
    const away = state.year !== st.y ? `<button class="link" data-act="sback">${esc(tr("story.back", { y: fy(st.y) }))}</button>` : "";
    const nextLabel = last ? (nextCh ? tr("story.nextChapter", { t: nextCh.title }) : tr("story.done")) : tr("story.next");
    return `<div class="story">
      <div class="story-top"><button class="back" data-act="chapters">${esc(tr("story.all"))}</button><span class="tag">${i + 1} / ${c.steps.length}</span></div>
      <div class="story-ch">${esc(c.title)} · ${fyr(...c.span)}</div>
      <div class="cy">${fy(st.y)}</div><h4>${esc(st.t)}</h4><p>${esc(st.b)}</p>${away}
      ${hasLong(c) ? `<button class="link" data-act="read">${esc(tr("story.read"))} →</button>` : ""}
      <div class="story-dots">${c.steps.map((o, j) =>
        `<button class="sd${j === i ? " on" : ""}" data-act="sstep" data-i="${j}" aria-label="${esc(tr("story.stepLabel", { n: j + 1, t: o.t }))}"></button>`).join("")}</div>
      <div class="story-nav"><button class="btn" data-act="sprev">${esc(tr(i ? "story.prev" : "story.toc"))}</button>
        <button class="btn primary" data-act="snext">${esc(nextLabel)}</button></div></div>`;
  }

  // The reading layout: the whole chapter as one long column beside the map. Scrolling a step's section past the
  // reading line moves the map to that step; choosing a step (contents, arrow keys, a link) scrolls to its section.
  function readSec() {
    const c = STORIES[state.story.ch], nextCh = STORIES[state.story.ch + 1];
    const facts = f => f && f.length ? `<dl class="facts"><dt>${esc(tr("read.facts"))}</dt>${f.map(([k, v]) =>
      `<dd><span>${esc(k)}</span><b>${esc(v)}</b></dd>`).join("")}</dl>` : "";
    return `<article class="reader">
      <div class="rd-bar"><span>${esc(c.title)} · <b class="rd-n"></b> / ${c.steps.length}</span>
        <button class="x" data-act="unread" aria-label="${esc(tr("read.close"))}" title="${esc(tr("read.close"))}">×</button></div>
      <header class="rd-head"><div class="rd-span">${fyr(...c.span)}</div><h2>${esc(c.title)}</h2><p>${esc(c.lede)}</p>
        <ol class="rd-toc">${c.steps.map((st, j) => `<li><button data-act="rd-go" data-i="${j}"><span class="yr">${fy(st.y)}</span>${esc(st.t)}</button></li>`).join("")}</ol></header>
      ${c.steps.map((st, j) => `<section class="rd-step" data-i="${j}">
        <div class="rd-k">${esc(tr("read.step", { n: j + 1 }))} · ${fy(st.y)}</div><h3>${esc(st.t)}</h3>
        <p class="rd-lead">${esc(st.b)}</p>${(st.long ? st.long.p : []).map(t => `<p>${esc(t)}</p>`).join("")}${facts(st.long && st.long.facts)}</section>`).join("")}
      <div class="rd-end">${nextCh ? `<button class="btn" data-act="rd-next">${esc(tr("story.nextChapter", { t: nextCh.title }))}</button>` : ""}
        <button class="btn primary" data-act="unread">${esc(tr("read.close"))}</button></div></article>`;
  }
  let readObs = null;
  function renderReader() {
    const key = `read|${state.story.ch}|${LOC.meta.code}`;
    if (key !== sideKey) {
      sideKey = key;
      side.innerHTML = readSec();
      watchSteps();
      scrollToStep(state.story.step);
    }
    const i = state.story.step;
    side.querySelector(".rd-n").textContent = i + 1;
    side.querySelectorAll(".rd-step").forEach((n, j) => n.classList.toggle("on", j === i));
    side.querySelectorAll(".rd-toc li").forEach((n, j) => n.classList.toggle("on", j === i));
    syncHash();
  }
  // the reading line sits a third of the way down the panel; on phones the page scrolls under the map, so lower
  function watchSteps() {
    if (readObs) readObs.disconnect();
    const page = oneColumn.matches;
    readObs = new IntersectionObserver(entries => {
      if (!state.reading) return;
      const hit = entries.filter(en => en.isIntersecting).map(en => +en.target.dataset.i);
      if (hit.length && hit[hit.length - 1] !== state.story.step) goStep(hit[hit.length - 1], true);
    }, { root: page ? null : side, rootMargin: page ? "-44% 0px -52% 0px" : "-30% 0px -66% 0px" });
    side.querySelectorAll(".rd-step").forEach(n => readObs.observe(n));
  }
  // the reading line belongs to the panel or the page depending on the layout, so follow a change of layout
  oneColumn.addEventListener("change", () => { if (state.reading) watchSteps(); });
  // the first step scrolls to the top, so the chapter's title and contents show above it
  function scrollToStep(i) {
    const n = side.querySelector(`.rd-step[data-i="${i}"]`);
    if (i && n) n.scrollIntoView({ block: "start" });
    else if (oneColumn.matches) scrollTo(0, 0);
    else side.scrollTop = 0;
  }
  function setReading(on) {
    state.reading = !!on && !!state.story && hasLong(STORIES[state.story.ch]);
    $(".app").classList.toggle("reading", state.reading);
    if (!state.reading && readObs) readObs.disconnect();
    sideKey = "";
    fit(); // the map changed size: refit now, so the step's view below is computed for the new size
    const st = curStep();
    if (st) zoomToBox(st.box);
    renderSide(true);
    if (!state.reading) { side.scrollTop = 0; if (oneColumn.matches) scrollTo(0, 0); }
  }

  // The panel is rebuilt only when its content changes; what moves with every year (the events window, the sparkline's
  // year line) is patched in place, so playback doesn't replace a row under the pointer or the keyboard focus.
  let sidePressed = false, sidePending = false;
  function renderSide(force) {
    if (state.reading) return renderReader();
    const rec = recentEvents(), up = upcomingEvents(), s = state.sel;
    const key = [state.snap, s && s.kind, s && s.id, s && s.side, rec.map(e => e.id).join(","), up.map(e => e.id).join(","),
      state.show.chg, state.chgAll, state.mode, state.story ? `${state.story.ch}-${state.story.step}-${curStep().y === state.year}` : "",
      comparing() ? `${state.yearA}-${state.year}` : ""].join("|");
    if (key !== sideKey || force) {
      if (sidePressed) sidePending = true; // rebuild once the button is released, so its click still lands
      else {
        sideKey = key;
        const a = document.activeElement, refocus = a !== side && side.contains(a) ? focusSel(a) : null;
        side.innerHTML = storySec() + selCard() + (comparing() ? compareSec() : eventsSec() + changesSec()) + footer();
        if (refocus !== null) (refocus && side.querySelector(refocus) || side.querySelector("[data-act=snext]") || side).focus({ preventScroll: true });
      }
    }
    const Y = state.year, x = sparkX(Y);
    side.querySelectorAll(".rng").forEach(n => { n.textContent = recentRange(Y); });
    side.querySelectorAll(".spark-now.b").forEach(l => { l.setAttribute("x1", x); l.setAttribute("x2", x); });
    syncHash();
  }
  // a selector for the same control in the rebuilt panel
  function focusSel(el) {
    const act = el.dataset && el.dataset.act;
    if (!act) return "";
    const k = ["i", "id", "k", "a", "d"].find(k => el.dataset[k] != null);
    return `[data-act="${act}"]` + (k ? `[data-${k}="${CSS.escape(el.dataset[k])}"]` : "");
  }
  side.addEventListener("pointerdown", () => { sidePressed = true; });
  for (const type of ["pointerup", "pointercancel"]) addEventListener(type, () => {
    if (!sidePressed) return;
    sidePressed = false;
    if (sidePending) setTimeout(() => { sidePending = false; renderSide(true); });
  });

  side.addEventListener("click", ev => {
    const b = ev.target.closest("[data-act]");
    if (!b) return;
    const act = b.dataset.act;
    if (act === "close") select(null);
    else if (act === "read") setReading(true);
    else if (act === "unread") setReading(false);
    else if (act === "rd-go") goStep(+b.dataset.i);
    else if (act === "rd-next") openStory(state.story.ch + 1);
    else if (act === "chg-all") {
      state.chgAll = true;
      renderSide(true);
      const first = side.querySelectorAll("[data-act=chg]")[3]; // keyboard focus moves to the first row that just appeared
      if (first) first.focus({ preventScroll: true });
    }
    else if (act === "preset") { setYearA(+b.dataset.a); setYear(+b.dataset.b); }
    else if (act === "ya") setYearA(snapStep(state.yearA, +b.dataset.d));
    else if (act === "yb") setYear(snapStep(state.year, +b.dataset.d));
    else if (act === "cmp-id") {
      select({ kind: "ident", id: b.dataset.id });
      const fs = feats.filter(f => f.properties.i === b.dataset.id);
      const pool = fs.length ? fs : featsA.filter(f => f.properties.i === b.dataset.id);
      if (pool.length) zoomToFeature({ type: "FeatureCollection", features: pool });
    }
    else if (act === "chapter") openStory(+b.dataset.i);
    else if (act === "chapters") closeStory();
    else if (act === "sprev") state.story.step ? goStep(state.story.step - 1) : closeStory();
    else if (act === "snext") nextStep();
    else if (act === "sstep") goStep(+b.dataset.i);
    else if (act === "sback") goStep(state.story.step);
    else if (act === "lineage") select({ kind: "lineage", id: b.dataset.id });
    else if (act === "locate") { const e = EVENTS[state.sel.id]; zoomToPoint(e.lon, e.lat); }
    else if (act === "ev") {
      const e = EVENTS[+b.dataset.id];
      if (e.year > state.year && !comparing()) setYear(e.year);
      select({ kind: "event", id: e.id });
      zoomToPoint(e.lon, e.lat);
    } else if (act === "chg") {
      const f = changesOf(YEARS[state.snap]).find(c => c.properties.k === +b.dataset.k);
      if (!f) return;
      zoomToFeature(f);
      gPulse.selectAll("path").remove();
      gPulse.append("path").datum(f).attr("class", "pulse").attr("d", path);
    }
  });
  side.addEventListener("pointerover", ev => {
    const b = ev.target.closest("[data-act=chg]");
    gChg.selectAll("path").classed("hot", d => !!b && d.properties.k === +b.dataset.k);
  });
  side.addEventListener("pointerleave", () => gChg.selectAll("path").classed("hot", false));

  // ---------- state changes ----------
  function setYear(y, fromPlay) {
    y = Math.max(Y0, Math.min(YN, Math.round(y)));
    if (y === 0) y = state.year > 0 ? -1 : 1; // 1 BC is followed by AD 1
    if (!fromPlay) state.t = tf(y);
    if (y === state.year) return;
    state.year = y;
    const i = snapIndexFor(y), forward = i === state.snap + 1;
    if (i !== state.snap) {
      if (state.snap >= 0) crossfade();
      state.snap = i;
      state.chgAll = false;
      renderSnapshot(forward && state.show.chg);
    } else renderCities();
    renderEvents();
    updateClock();
    movePlayhead();
    renderSide();
  }

  function select(s) {
    state.sel = s;
    applySelection();
    renderEvents();
    drawTimeline();
    renderSide(true);
  }

  // the next or previous snapshot year; from a year between snapshots, "previous" is the snapshot it shows
  const snapStep = (y, dir) => {
    const i = snapIndexFor(y);
    return dir > 0 ? YEARS[i + 1] ?? YN : y > YEARS[i] ? YEARS[i] : YEARS[i - 1] ?? Y0;
  };
  function stepSnap(dir) {
    stopPlay();
    setYear(snapStep(state.year, dir));
  }

  let lastTs = null;
  function loop(ts) {
    if (!state.playing) return;
    if (lastTs == null) lastTs = ts;
    const dt = Math.min(.1, (ts - lastTs) / 1000);
    lastTs = ts;
    state.t = Math.min(1, state.t + dt / 100);
    setYear(ty(state.t), true);
    if (state.t >= 1) return stopPlay();
    requestAnimationFrame(loop);
  }
  function startPlay() {
    if (state.year >= YN) setYear(Y0);
    state.playing = true;
    state.t = tf(state.year);
    lastTs = null;
    $("#playicon").innerHTML = '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>';
    $("#play").setAttribute("aria-label", tr("pause"));
    requestAnimationFrame(loop);
  }
  function stopPlay() {
    if (!state.playing) return;
    state.playing = false;
    $("#playicon").innerHTML = '<path d="M7 4.5v15l12-7.5z"/>';
    $("#play").setAttribute("aria-label", tr("play"));
    syncHash();
  }
  const togglePlay = () => state.playing ? stopPlay() : startPlay();

  $("#play").onclick = togglePlay;
  $("#prev").onclick = () => stepSnap(-1);
  $("#next").onclick = () => stepSnap(1);
  function bindToggle(id, key, after) {
    const b = $(id);
    b.onclick = () => {
      state.show[key] = !state.show[key];
      b.setAttribute("aria-pressed", state.show[key]);
      after();
    };
  }
  bindToggle("#t-chg", "chg", () => { renderSnapshot(false); renderSide(true); });
  bindToggle("#t-ev", "ev", () => { renderEvents(); });
  bindToggle("#t-modern", "modern", () => modernPath.attr("d", state.show.modern ? path(MODERN) : null));
  bindToggle("#t-phys", "phys", () => { gPhys.style("display", state.show.phys ? null : "none"); placePhysLabels(); });
  // the layers menu stays open while switches are flipped; a press anywhere else or Esc closes it
  const layersBtn = $("#layers-btn"), layersMenu = $("#layers");
  function openLayers(open) {
    layersMenu.hidden = !open;
    layersBtn.setAttribute("aria-expanded", open);
  }
  layersBtn.onclick = () => openLayers(layersMenu.hidden);
  document.addEventListener("pointerdown", ev => {
    if (!layersMenu.hidden && !layersMenu.contains(ev.target) && !layersBtn.contains(ev.target)) openLayers(false);
  });

  document.addEventListener("keydown", e => {
    const target = e.target instanceof Element ? e.target : document.body;

      return;
    }
    try { localStorage.setItem(LANG_KEY, code); } catch (e) { /* storage unavailable */ }
    if (params.has("lang")) { // the address would otherwise win over this choice on the next visit
      params.set("lang", code);
      history.replaceState(null, "", `?${params}${location.hash}`);
    }
    localizeContent();
    SEARCH = buildSearch();
    loadAlt();
    applyStatic();
    closeResults();
    applySelection();
    renderEvents();
    drawTimeline();
    updateClock();
    if (comparing()) renderCompare();
    renderSide(true);
  }
  $("#lang").onclick = () => setLang($("#lang").dataset.next);

  new ResizeObserver(() => { fit(); scheduleOverlay(); }).observe(mapEl);
  new ResizeObserver(() => drawTimeline()).observe($("#timewrap"));

  // ---------- links ----------
  // #1650, #1650/state:Serbia, #1215/event:magna-carta, #napoleon/3 (story step), #napoleon/3/read (in the reading layout),
  // #stories, #compare-1914-1920; BC years are written 500bc
  const hy = y => y < 0 ? `${-y}bc` : `${y}`;
  function stateHash() {
    if (state.mode === "story") return state.story ? STORIES[state.story.ch].id + (state.story.step ? `/${state.story.step + 1}` : "") + (state.reading ? "/read" : "") : "stories";
    const s = state.sel;
    const sel = !s ? "" : "/" + (s.kind === "event" ? `event:${EVENTS[s.id].key}` : `${s.kind === "ident" ? "state" : "lineage"}:${encodeURIComponent(s.id)}`);
    return (comparing() ? `compare-${hy(state.yearA)}-${hy(state.year)}` : hy(state.year)) + sel;
  }
  // written a moment after the view settles (browsers limit how often the URL may change), not during playback
  let hashTimer = 0;
  function syncHash() {
    clearTimeout(hashTimer);
    hashTimer = setTimeout(() => {
      if (state.playing) return;
      const h = stateHash(), want = h === hy(START) ? "" : "#" + h; // the opening view needs no hash
      if (want !== location.hash) history.replaceState(null, "", want || location.pathname + location.search);
    }, 400);
  }
  function applyHash(raw) {
    const anchor = raw.replace(/^#/, ""), cut = anchor.indexOf("/");
    const head = cut < 0 ? anchor : anchor.slice(0, cut), tail = cut < 0 ? "" : anchor.slice(cut + 1);
    const ch = STORIES.findIndex(c => c.id === head);
    if (ch >= 0) {
      const parts = tail.split("/"), n = +parts.find(t => /^\d+$/.test(t)) || 1, read = parts.includes("read");
      openStory(ch);
      if (n > 1) goStep(n - 1);
      if (read !== state.reading) setReading(read);
      return;
    }
    if (head === "stories") {
      setMode("story");
      if (state.story) closeStory();
      return;
    }
    const Y = "(\\d{1,4}(?:bc)?)", py = t => t.endsWith("bc") ? -parseInt(t) : +t;
    const cmp = head.match(new RegExp(`^compare(?:-${Y}-${Y})?$`)), year = head.match(new RegExp(`^${Y}$`));
    if (!cmp && !year) return;
    stopPlay();
    if (cmp) {
      if (!comparing()) setMode("compare");
      if (cmp[1]) { setYearA(py(cmp[1])); setYear(py(cmp[2])); }
    } else {
      if (state.mode !== "explore") setMode("explore");
      setYear(py(head));
    }
    const decode = t => { try { return decodeURIComponent(t); } catch (e) { return null; } }; // a malformed link selects nothing
    const m = tail.match(/^(state|lineage|event):(.+)$/), id = m && decode(m[2]);
    if (m && m[1] === "event") {
      const e = EVENTS.find(e => e.key === id);
      if (e) { select({ kind: "event", id: e.id }); zoomToPoint(e.lon, e.lat); }
    } else if (m && (m[1] === "state" ? IDENTS[id] : LIN[id])) {
      const kind = m[1] === "state" ? "ident" : "lineage", hit = kind === "ident" ? p => p.i === id : p => p.l === id;
      select({ kind, id });
      const fs = feats.filter(f => hit(f.properties));
      if (fs.length) zoomToFeature({ type: "FeatureCollection", features: fs });
    } else if (state.sel) select(null);
  }
  addEventListener("hashchange", () => applyHash(location.hash));

  applyStatic();
  $("#loading").remove();
  drawTimeline(); // first: its height sets the map's, so the map is fitted once at its final size
  document.fonts.ready.then(() => drawTimeline()); // era names are measured in the web font once it has loaded
  fit();
  setYear(START);
  applyHash(location.hash);
  loadAlt();
})().catch(err => {
  const el = document.getElementById("loading");
  if (el) el.textContent = `边界数据没能载入 · Couldn't load the map data (${err.message})`;
  console.error(err);
});
</script>
</body>
</html>
